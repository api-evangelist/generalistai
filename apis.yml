aid: generalistai
name: Generalist AI
description: >-
  Generalist AI is a frontier AI research and product company founded in 2024 that is building
  general intelligence for the physical world. Rather than manufacturing robots, Generalist builds
  the embodied foundation models — the "brain" — that run across many robot types and hardware
  configurations, with an emphasis on dexterity and autonomy. Its founding team of researchers,
  roboticists, and operators comes from Google DeepMind, Boston Dynamics, and OpenAI, with prior work
  on PaLM-E, RT-2, Gemini Robotics, Atlas, Spot, and the scaling of large language models. The
  company's GEN-1 model (April 2026) is described as the first general-purpose model to reach mastery
  of simple physical tasks, running with full autonomy. Generalist operates from the Bay Area
  (San Mateo / San Francisco) and Boston, and has raised more than $500M — including a $400M round at
  a roughly $2B valuation backed by Nvidia, Bezos Expeditions, Radical Ventures, 8VC, Union Square
  Ventures, Norwest Venture Partners, Hanabi Capital, and boldstart ventures. Generalist AI currently
  publishes no public API or developer program; this profile captures its company identity and web
  presence for the API Evangelist network.
